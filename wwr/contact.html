<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="description"
      content="This page provides an overview, information about how to contact.">
    <meta name="author" content="Henry Gerald Zubieta Gutierrez">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img class="img-logo" src="images/rafting_travel_compas.jpg" alt="Rafting Travel Logo"
          width="150">
        <div id="logo">Rafting Travel</div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div>
            <h1 class="contact">White Water Rafting Company</h1>
            <article>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </article>
        </div>
        <div class="contact-layout">
            <figure>
                <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15193.943902027902!2d-63.23856939999999!3d-17.81583925!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2sbo!4v1785725473327!5m2!1ses-419!2sbo"
                      width="600" height="450" ; allowfullscreen="" loading="lazy"
                      referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
            </figure>
            <figure>
                <form class="box contact-form">
                    <div class="form-group">
                        <label for="i1">Name</label>
                        <input type="text" name="i1" id="i1" placeholder="Type your name" required>
                    </div>
                    <div class="form-group">
                        <label for="i2">Email</label>
                        <input type="email" name="i2" id="i2" placeholder="Type your email"
                          required>
                    </div>
                    <div class="form-group">
                        <fieldset>
                            <legend>Message Purpose</legend>

                            <label>
                                <input type="radio" id="r1" name="r1" value="general-inquiry">
                                General Inquiry
                            </label><br>

                            <label>
                                <input type="radio" id="r2" name="r2" value="reservation-question">
                                Reservation Question
                            </label><br>

                            <label>
                                <input type="radio" id="r3" name="r3" value="website-suggestion">
                                Website Suggestion
                            </label>
                        </fieldset>
                    </div>
                    <div class="form-group">
                        <label for="i4">Message</label>
                        <textarea name="i4" id="i4" placeholder="Type here ..."></textarea>
                    </div>
                    <div class="form-group">
                        <input type="checkbox" id="subscribe" name="subscribe">
                        <label for="subscribe">
                            Please subscribe me to the monthly newsletter
                        </label>
                    </div>
                    <button class="submit-btn" type="submit">Get in Touch!</button>
                </form>
            </figure>
        </div>
        <section>
            <h2>We Are Here To Serve You</h2>
            <div class="contact-flex-container">
                <figure>
                    <img class="flex-img" src="images/whitewater_rafting_1.jpg"
                      alt="Profile Jhon 1">
                    <figcaption>Jhon</figcaption>
                </figure>
                <figure>
                    <img class="flex-img" src="images/whitewater_rafting_2.jpg" alt="Profile Ann 2">
                    <figcaption>Ann</figcaption>
                </figure>
                <figure>
                    <img class="flex-img" src="images/whitewater_rafting_3.jpg"
                      alt="Profile Louise 3">
                    <figcaption>Louise</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy;2026 🚣 Rafting Travel 🚣 Henry G. Zubieta</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/gheraldz">
                <img src="images/facebook.svg" alt="Facebook Icon" width="40">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon" width="40">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon" width="40">
            </a>
        </nav>
    </footer>
</body>

</html>
