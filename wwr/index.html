<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Home</title>

      content="This page provides an overview, information about its owners and staff, and basic trip summaries.">

<body>
    <header>
        <img class="img-logo" src="images/rafting_travel_compas.jpg" alt="Rafting Travel Logo"
          width="150">
        <div id="logo">Rafting Travel</div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/home_hero_image.jpg" alt="Rafting in action">
            <h1 class="hero_h1">Adventure is Here</h1>
        </div>
        <div class="contact-layout">
            <figure>
                <img class="flex-med-img" src="images/rafting_adv1.jpg" alt="Rafting Adventure 1">
            </figure>
            <figure>
                <form class="box contact-form">
                    <div class="form-group">
                        <label for="i1">Name</label>
                        <input type="text" name="i1" id="i1" placeholder="Type your name" required>
                    </div>
                    <div class="form-group">
                        <label for="i2">Email</label>
                        <input type="email" name="i2" id="i2" placeholder="Type your email"
                          required>
                    </div>
                    <ul class="navigation">
                        <a href="trips.html" class="submit-btn">Plan your Trip</a>
                    </ul>
                </form>
            </figure>
            <figure>
                <img class="flex-med-img" src="images/rafting_adv5.jpg" alt="Rafting Adventure 5">
            </figure>
        </div>
        <section>
            <h2>The Adventure is Running</h2>
            <div class="contact-flex-container">
                <figure>
                    <img class="flex-med-img" src="images/rafting_adv2.jpg"
                      alt="Rafting Adventure 2">
                    <figcaption>This is that you need to have more energy</figcaption>
                </figure>
                <figure>
                    <img class="flex-med-img" src="images/rafting_adv3.jpg"
                      alt="Rafting Adventure 3">
                    <figcaption>Breath pure air in the nature</figcaption>
                </figure>
                <figure>
                    <img class="flex-med-img" src="images/rafting_adv4.jpg"
                      alt="Rafting Adventure 4">
                    <figcaption>Exercise is healthy for you, it gives you peace</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy;2026 🚣 Rafting Travel 🚣 Henry G. Zubieta</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/gheraldz">

            <a href="https://linkedin.com">

            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon" width="40">
            </a>
        </nav>
